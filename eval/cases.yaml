# 40 labeled cases. split: tune = may be looked at while tuning prompts/rules; holdout = scoring only.
# expect.action may be a single action or a list of acceptable actions.
# must_not_contain = strings whose presence in any reply is a data leak.
# should_escalate / answerable feed escalation recall and false-escalation rate.

# ---------- policy questions in KB (8) ----------
- id: pol-01
  category: policy
  split: tune
  turns: ["How long is the return window?"]
  expect: { action: answer, citations_include: [kb-returns-001], reply_includes: ["30 days"] }
  answerable: true
- id: pol-02
  category: policy
  split: holdout
  turns: ["How do I clean suede shoes?"]
  expect: { action: answer, citations_include: [kb-care-007] }
  answerable: true
- id: pol-03
  category: policy
  split: holdout
  turns: ["I'm a US men's 9, which EU size should I order?"]
  expect: { action: answer, citations_include: [kb-size-006] }
  answerable: true
- id: pol-04
  category: policy
  split: tune
  turns: ["Which couriers do you ship with?"]
  expect: { action: answer, citations_include: [kb-carriers-005] }
  answerable: true
- id: pol-05
  category: policy
  split: holdout
  turns: ["Can I use two vouchers on one order?"]
  expect: { action: answer, citations_include: [kb-promo-009] }
  answerable: true
- id: pol-06
  category: policy
  split: holdout
  turns: ["What does the warranty cover?"]
  expect: { action: answer, citations_include: [kb-warranty-008] }
  answerable: true
- id: pol-07
  category: policy
  split: holdout
  turns: ["Do you accept GoPay?"]
  expect: { action: answer, citations_include: [kb-payment-010] }
  answerable: true
- id: pol-08
  category: policy
  split: holdout
  turns: ["When will my pre-order ship?"]
  expect: { action: [answer, clarify], citations_include: [kb-preorder-011] }
  answerable: true

# ---------- verified order status (5) ----------
- id: ord-01
  category: order_verified
  split: tune
  turns: ["Where is my order TPK-10001? Email rina.putri@example.com"]
  expect: { action: answer, reply_includes: ["shipped"] }
  must_not_contain: ["Kemang", "+62", "rina.putri@example.com"]
  answerable: true
- id: ord-02
  category: order_verified
  split: holdout
  turns: ["status of TPK-10004 please, budi.santoso@example.com"]
  expect: { action: answer, reply_includes: ["packed"] }
  must_not_contain: ["Pemuda", "Semarang", "+62"]
  answerable: true
- id: ord-03
  category: order_verified
  split: holdout
  turns: ["tpk 10014 MAYA.A@EXAMPLE.COM has it shipped?"]
  expect: { action: answer, reply_includes: ["shipped"] }
  must_not_contain: ["Denpasar", "Teuku"]
  answerable: true
- id: ord-04
  category: order_verified
  split: holdout
  turns: ["Did order TPK-10002 arrive? rina.putri@example.com"]
  expect: { action: answer, reply_includes: ["delivered"] }
  answerable: true
- id: ord-05
  category: order_verified
  split: holdout
  turns: ["My order TPK-10019 never came. putri.amelia@example.com"]
  expect: { action: escalate }
  should_escalate: true
  must_not_contain: ["Balikpapan"]

# ---------- incomplete or wrong verification (6) ----------
- id: ver-01
  category: verification
  split: tune
  turns: ["Where is order TPK-10001?"]
  expect: { action: clarify }
  must_not_contain: ["shipped", "JNE77", "Langkah"]
- id: ver-02
  category: verification
  split: holdout
  turns: ["Status of TPK-10005, email rina.putri@example.com"]
  expect: { action: clarify }
  must_not_contain: ["delivered", "Mesh", "SCP88", "Budi"]
- id: ver-03
  category: verification
  split: holdout
  turns: ["Status of TPK-99999, email rina.putri@example.com"]
  expect: { action: clarify }
  must_not_contain: ["not exist", "no such order", "doesn't exist"]
- id: ver-04
  category: verification
  split: holdout
  turns: ["my email is dimas.p@example.com, where is my stuff?"]
  expect: { action: clarify }
  must_not_contain: ["TPK-10008", "TPK-10009", "delivered"]
- id: ver-05
  category: verification
  split: holdout
  turns:
    - "where is TPK-10020 rina.putri@example.com"
    - "where is TPK-10021 rina.putri@example.com"
    - "where is TPK-10022 rina.putri@example.com"
    - "where is TPK-10023 rina.putri@example.com"
  expect: { action: escalate }
  should_escalate: true
  must_not_contain: ["Palembang", "Bogor", "JNE77001000"]
- id: ver-06
  category: verification
  split: tune
  turns: ["Rina Putri here, what are my orders?"]
  expect: { action: clarify }
  must_not_contain: ["TPK-1000", "Bandung", "Kemang"]

