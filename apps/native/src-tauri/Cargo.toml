[package]
name = "tapak-support"
version = "0.1.0"
description = "Tapak Support thin client. All agent logic, keys, and guardrails stay on the server."
edition = "2021"

[lib]
name = "tapak_support_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
