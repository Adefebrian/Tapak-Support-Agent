name: native

# Thin-client builds of the same web bundle. Binaries are published as workflow artifacts,
# never committed and never added to the submission ZIP.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_targets: ""
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri -> target
      - name: Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - run: bun install
        working-directory: apps/native
      - name: Build
        working-directory: apps/native
        run: bunx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: tapak-${{ matrix.platform }}
          path: |
            apps/native/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/native/src-tauri/target/**/release/bundle/msi/*.msi
            apps/native/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/native/src-tauri/target/**/release/bundle/appimage/*.AppImage
            apps/native/src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: warn

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The runner image already ships the Android SDK and NDK; only add the platform the build needs.
      - name: Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri -> target
      - run: bun install --frozen-lockfile
      - run: bun install
        working-directory: apps/native
      - name: Init and build debug APK
        working-directory: apps/native
        run: |
          bunx tauri android init --ci
          # Tauri's template already allows plain HTTP in debug builds, which the emulator needs to reach
          # the host backend at 10.0.2.2:8787. Adding the attribute again breaks the manifest.
          grep -n "usesCleartextTraffic" src-tauri/gen/android/app/src/main/AndroidManifest.xml
          bunx tauri android build --debug --apk
      - uses: actions/upload-artifact@v4
        with:
          name: tapak-android-debug-apk
          path: apps/native/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # On a version tag, gather every binary into one draft release. A draft is not public until published.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.apk' \) -print > files.txt
          cat files.txt
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft \
            --title "Tapak Support ${GITHUB_REF_NAME}" \
            --notes "Thin desktop and Android clients for the Tapak Support Agent, built from this tag with Tauri 2 (Rust). Unsigned: on macOS right-click > Open; on Windows SmartScreen will warn. The app needs the server running (bun run dev) and its address set in the mode dialog." \
            $(cat files.txt)
