name: native

# Thin-client builds of the same web bundle. Binaries are published as workflow artifacts,
# never committed and never added to the submission ZIP.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_targets: ""
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri -> target
      - name: Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - run: bun install
        working-directory: apps/native
      - name: Build
        working-directory: apps/native
        run: bunx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: tapak-${{ matrix.platform }}
          path: |
            apps/native/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/native/src-tauri/target/**/release/bundle/msi/*.msi
            apps/native/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/native/src-tauri/target/**/release/bundle/appimage/*.AppImage
            apps/native/src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: warn

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The runner image already ships the Android SDK and NDK; only add the platform the build needs.
      - name: Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri -> target
      - run: bun install --frozen-lockfile
      - run: bun install
        working-directory: apps/native
      - name: Init and build release APK
        working-directory: apps/native
        run: |
          bunx tauri android init --ci
          # The app talks to a server address the user sets (http://10.0.2.2:8787 on the emulator), so the
          # release build must allow plain HTTP too. Tauri's template only enables it for debug builds.
          gradle=src-tauri/gen/android/app/build.gradle.kts
          grep -n 'usesCleartextTraffic' "$gradle"
          sed -i 's/manifestPlaceholders\["usesCleartextTraffic"\] = "false"/manifestPlaceholders["usesCleartextTraffic"] = "true"/' "$gradle"
          if grep -q 'usesCleartextTraffic"\] = "false"' "$gradle"; then echo "cleartext still disabled for release" >&2; exit 1; fi
          # Release build (LTO, stripped) for real phones (arm64) and the emulator (x86_64).
          bunx tauri android build --apk --target aarch64 --target x86_64
      - name: Sign the APK
        working-directory: apps/native/src-tauri/gen/android/app/build/outputs/apk
        run: |
          unsigned=$(find . -name '*release-unsigned.apk' | head -1)
          echo "unsigned: $unsigned"
          bt="$ANDROID_HOME/build-tools/34.0.0"
          # A key made for this build only: the APK installs normally, but a later build cannot update it in place.
          keytool -genkeypair -keystore "$RUNNER_TEMP/tapak.jks" -alias tapak -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass tapak-build -keypass tapak-build -dname "CN=Tapak Support, O=Tapak Footwear, C=ID"
          "$bt/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          mkdir -p "$GITHUB_WORKSPACE/apk"
          version=$(jq -r .version "$GITHUB_WORKSPACE/apps/native/src-tauri/tauri.conf.json")
          out="$GITHUB_WORKSPACE/apk/Tapak Support_${version}_android.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/tapak.jks" --ks-pass pass:tapak-build --out "$out" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify --verbose "$out"
          ls -la "$GITHUB_WORKSPACE/apk"
      - uses: actions/upload-artifact@v4
        with:
          name: tapak-android-apk
          path: apk/*.apk
          if-no-files-found: error

  # On a version tag, gather every binary into one draft release. A draft is not public until published.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The source code as a release asset: the same archive as the submission ZIP (git archive of the tag).
      - name: Source archive
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=tapak-support-agent/ -o dist/tapak-support-agent-source.zip "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bundle names contain spaces ("Tapak Support_0.1.1..."). GitHub turns spaces in asset names into dots,
          # so rename first: the checksum file then lists exactly the names people download.
          mkdir -p upload
          find dist -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.apk' -o -name '*-source.zip' \) -print0 |
            while IFS= read -r -d '' f; do b=$(basename "$f"); cp "$f" "upload/${b// /.}"; done
          (cd upload && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft \
            --title "Tapak Support ${GITHUB_REF_NAME}" \
            --notes "Thin desktop and Android clients for the Tapak Support Agent, built from this tag with Tauri 2 (Rust). Unsigned: on macOS right-click > Open; on Windows SmartScreen will warn. The app needs the server running (bun run dev) and its address set in the mode dialog." \
            upload/*
